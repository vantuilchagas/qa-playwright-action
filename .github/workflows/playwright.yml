name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    
    # Executa os testes Web de login e os testes de API.
    - name: Run Web and API Tests
      run: npx playwright test tests/login.spec.js tests/api/posts.spec.js --project=chromium

    
    # Publica os relatórios e as evidências produzidas pelos testes.
    - name: Upload Playwright Evidence
      uses: actions/upload-artifact@v4

      # Executa o upload mesmo quando os testes falharem.
      if: ${{ !cancelled() }}

      with:
        # Identifica o pacote de evidências no GitHub Actions.
        name: playwright-evidence

        # Inclui relatório HTML, vídeos, screenshots e traces.
        path: |
          playwright-report/
          test-results/

        # Avisa caso nenhuma evidência seja encontrada.
        if-no-files-found: warn

        # Mantém o pacote por sete dias.
        retention-days: 7
